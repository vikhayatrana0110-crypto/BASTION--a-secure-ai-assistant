[project]
name = "bastion"
version = "0.1.0"
description = "Secure enterprise knowledge assistant with database-enforced access control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "argon2-cffi>=25.1",    
    "pyjwt>=2.14",
     "tokenizers>=0.23"
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.12", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
markers = ["integration: needs a running database"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"